<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laynea.com x Eclair2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Righteous&family=Kanit:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#0d0f2e;--bg2:#2a1d6b;--pink:#ff8fc8;--gold:#ffd86b;--sky:#8fd3ff;--ink:#f6f3ff;--glass:rgba(255,255,255,.10);--glass2:rgba(255,255,255,.04);--edge:rgba(255,255,255,.38)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;font-family:'Mitr','Kanit',system-ui,sans-serif;color:var(--ink);background:#0d0f2e;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-2;background:
 radial-gradient(60% 40% at 20% 10%,rgba(255,143,200,.35),transparent 70%),
 radial-gradient(55% 40% at 85% 25%,rgba(143,211,255,.28),transparent 70%),
 radial-gradient(70% 50% at 50% 100%,rgba(130,90,255,.45),transparent 70%),
 linear-gradient(180deg,var(--bg1),var(--bg2))}
.sparks{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.sparks i{position:absolute;top:-30px;left:var(--x);width:var(--s);height:var(--s);opacity:0;
 background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);
 animation:fall var(--d) linear var(--dl) infinite;will-change:transform,opacity}
@keyframes fall{0%{transform:translate3d(0,-5vh,0) rotate(0);opacity:0}10%{opacity:.9}85%{opacity:.7}100%{transform:translate3d(var(--dx),110vh,0) rotate(360deg);opacity:0}}
.wrap{width:100%;max-width:480px;margin:0 auto;padding:14px 16px 28px}
.hero{position:relative;margin-bottom:76px}
.banner{display:block;width:100%;aspect-ratio:2.5/1;object-fit:cover;border-radius:22px;border:1.5px solid var(--edge);box-shadow:0 14px 40px -12px rgba(120,90,255,.6)}
.hero::after{content:"";position:absolute;left:0;right:0;top:0;aspect-ratio:2.5/1;border-radius:22px;background:linear-gradient(180deg,transparent 55%,rgba(13,15,46,.55));pointer-events:none}
.avatar{position:absolute;left:50%;bottom:-66px;width:132px;height:132px;margin-left:-66px;z-index:2;animation:bob 4.5s ease-in-out infinite}
.ring{position:absolute;inset:-7px;border-radius:50%;background:conic-gradient(from 0deg,var(--pink),var(--gold),var(--sky),#b48cff,var(--pink));animation:spin 6s linear infinite;will-change:transform}
.ring2{position:absolute;inset:-14px;border-radius:50%;border:2px dashed rgba(255,255,255,.55);animation:spin 18s linear infinite reverse;will-change:transform}
.avatar img{position:absolute;inset:0;width:100%;height:100%;border-radius:50%;object-fit:cover;border:4px solid #14163d}
.orb{position:absolute;inset:-14px;animation:spin 9s linear infinite;will-change:transform}
.orb b{position:absolute;top:-4px;left:50%;margin-left:-8px;width:16px;height:16px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.orb.o2{animation-duration:13s;animation-direction:reverse}.orb.o2 b{background:var(--pink);top:auto;bottom:-4px;width:12px;height:12px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
h1{text-align:center;font-family:'Righteous','Kanit',sans-serif;font-weight:400;font-size:clamp(26px,8vw,34px);letter-spacing:.5px;line-height:1.15;
 background:linear-gradient(90deg,#fff,var(--pink) 35%,var(--gold) 65%,#fff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 2px 10px rgba(255,143,200,.45))}
@keyframes shine{to{background-position:-200% 0}}
.sub{text-align:center;font-size:13px;font-weight:300;color:rgba(255,255,255,.75);margin-top:4px;letter-spacing:.4px}
.tt{display:flex;justify-content:center;margin:16px 0 4px}
.round{position:relative;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;overflow:hidden;text-decoration:none;
 background:linear-gradient(145deg,rgba(255,255,255,.28),rgba(255,255,255,.05));border:1.5px solid var(--edge);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -8px 16px rgba(143,211,255,.12),0 10px 24px -8px rgba(0,0,0,.5);transition:transform .25s}
.round img{width:34px;height:34px;object-fit:contain;position:relative}
.round:active{transform:scale(.92)}
.round::after,.link::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg) translateX(-100%);animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%,70%{transform:skewX(-20deg) translateX(-100%)}100%{transform:skewX(-20deg) translateX(500%)}}
.info{position:relative;display:block;width:100%;margin:14px 0 6px;padding:0;border:1.5px solid var(--edge);border-radius:20px;overflow:hidden;background:var(--glass2);cursor:zoom-in;max-height:250px;box-shadow:0 12px 30px -14px rgba(0,0,0,.6)}
.info img{display:block;width:100%}
.info span{position:absolute;left:0;right:0;bottom:0;padding:34px 0 10px;text-align:center;font-size:12.5px;background:linear-gradient(180deg,transparent,rgba(13,15,46,.92));color:var(--gold)}
.links{display:grid;gap:12px;margin-top:18px}
.link{position:relative;display:flex;align-items:center;gap:14px;padding:11px 16px 11px 11px;border-radius:20px;overflow:hidden;color:var(--ink);text-decoration:none;
 background:linear-gradient(145deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 60%,rgba(255,255,255,.09));border:1.5px solid var(--edge);
 box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -10px 18px rgba(130,90,255,.14),0 10px 26px -12px rgba(0,0,0,.55);
 transition:transform .22s,box-shadow .22s,border-color .22s}
.link:nth-child(2n)::after{animation-delay:1.3s}.link:nth-child(3n)::after{animation-delay:2.4s}
.link img{width:46px;height:46px;border-radius:14px;object-fit:contain;flex:none}
.link .t{display:flex;flex-direction:column;min-width:0;flex:1}
.link b{font-weight:500;font-size:16px;line-height:1.25}
.link small{font-weight:300;font-size:12.5px;color:rgba(255,255,255,.72);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link svg{flex:none;width:18px;height:18px;opacity:.7;transition:transform .22s}
@media (hover:hover){.link:hover{transform:translateY(-3px);border-color:rgba(255,216,107,.8);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 16px 30px -12px rgba(255,143,200,.55)}.link:hover svg{transform:translateX(4px)}.round:hover{transform:scale(1.1) rotate(-4deg)}}
.link:active{transform:scale(.97)}
footer{text-align:center;margin-top:30px;font-size:12px;color:rgba(255,255,255,.6);letter-spacing:.5px}
footer a,footer span{color:var(--gold);font-family:'Righteous',sans-serif;letter-spacing:1px}
.lb{position:fixed;inset:0;z-index:50;display:none;background:rgba(8,9,28,.92);overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(18px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lb.on{display:block}.lb img{display:block;width:100%;max-width:560px;margin:0 auto;border-radius:16px}
.lb button{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:12px;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--edge);background:rgba(255,255,255,.15);color:#fff;font-size:20px}
.in{opacity:0;transform:translateY(14px);animation:in .6s ease forwards}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.in{opacity:1;transform:none}.sparks{display:none}}
</style>
</head>
